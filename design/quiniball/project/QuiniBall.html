<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuiniBall — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Archivo:ital,wght@0,700;0,800;1,800&family=Oswald:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0b0b11; --surface:#15151d; --surface-2:#1e1e29; --surface-3:#262633;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#f4f4f8; --muted:#8c8c9a; --muted-2:#6a6a78;
  --primary:#ff3b62; --primary-ink:#fff;
  --lime:#b6f24a; --good:#34d399; --bad:#fb7185;
  --font-display:'Saira Condensed'; --font-ui:'Manrope';
  --radius:20px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:radial-gradient(120% 90% at 50% 0%, #2a2470 0%, #16143a 40%, #0a0915 100%);
  font-family:var(--font-ui),system-ui,sans-serif; color:var(--text);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
#root{height:100vh;}

/* ── stage / phone scaling ───────────────────────────── */
.qb-stage{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;}
.qb-stage::before,.qb-stage::after{content:"";position:absolute;border-radius:50%;filter:blur(8px);opacity:.5;pointer-events:none;}
.qb-stage::before{width:240px;height:240px;left:8%;top:14%;background:radial-gradient(circle,rgba(120,90,255,.5),transparent 70%);}
.qb-stage::after{width:300px;height:300px;right:6%;bottom:10%;background:radial-gradient(circle,rgba(255,59,98,.28),transparent 70%);}
.qb-fit{transform-origin:center center;}
.qb-app{position:relative;width:412px;height:892px;}

/* device content fills dark */
.qb-app .qb-screen{min-height:100%;background:var(--bg);display:flex;flex-direction:column;}

/* svg icon defaults */
.qb-app svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.qb-emblem svg{stroke:none;}
.qb-star-ribbon svg,.qb-rank-av svg{fill:currentColor;stroke:none;}

/* ── logo ────────────────────────────────────────────── */
.qb-logo{display:flex;align-items:center;gap:9px;}
.qb-emblem{display:inline-flex;flex-shrink:0;}
.qb-em-ring{fill:none;stroke:var(--primary);stroke-width:3;}
.qb-em-mid{fill:none;stroke:var(--lime);stroke-width:3;}
.qb-em-dot{fill:var(--primary);}
.qb-word{font-family:var(--font-display);font-weight:700;font-style:italic;font-size:22px;letter-spacing:.4px;text-transform:uppercase;}
.qb-word b{color:var(--primary);font-weight:800;}
.qb-logo.is-mono .qb-word b{color:inherit;}

/* ── buttons / inputs ────────────────────────────────── */
.qb-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;
  font-family:var(--font-ui);font-weight:700;font-size:16px;border-radius:14px;padding:15px 20px;transition:.15s;}
.qb-btn svg{width:20px;height:20px;}
.qb-btn-block{width:100%;}
.qb-btn-primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 8px 24px -8px var(--primary);}
.qb-btn-primary:active{transform:translateY(1px);}
.qb-btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line-2);}
.qb-btn.is-off{opacity:.45;}
.qb-label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 7px;}
.qb-input{width:100%;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);
  border-radius:13px;padding:14px 15px;font-size:16px;font-family:var(--font-ui);font-weight:600;outline:none;transition:.15s;}
.qb-input:focus{border-color:var(--primary);}
.qb-input::placeholder{color:var(--muted-2);font-weight:500;}

/* ── 1 · LOGIN ───────────────────────────────────────── */
.qb-login{padding:24px 22px 24px;position:relative;justify-content:flex-start;gap:26px;}
.qb-login-glow{position:absolute;inset:0;background:radial-gradient(90% 50% at 50% 0%,rgba(255,59,98,.16),transparent 60%);pointer-events:none;}
.qb-login-top{position:relative;z-index:1;}
.qb-login-hero{margin-top:30px;}
.qb-kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin-bottom:10px;}
.qb-display{font-family:var(--font-display),'Arial Narrow',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;
  font-size:40px;line-height:.92;letter-spacing:.5px;margin:0;}
.qb-login-sub{color:var(--muted);font-size:14px;line-height:1.5;margin:14px 0 0;max-width:300px;}
.qb-login-form{position:relative;z-index:1;}
.qb-login-form .qb-label{margin-top:16px;}
.qb-pin{display:flex;gap:12px;margin-bottom:6px;align-items:stretch;}
.qb-pin-box{flex:1;min-width:0;height:62px;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:15px;
  text-align:center;font-family:var(--font-display),sans-serif;font-weight:800;font-size:30px;color:var(--text);outline:none;transition:.15s;padding:0;}
.qb-pin-box:focus{border-color:var(--primary);background:var(--surface-3);}
.qb-login-form .qb-btn-primary{margin-top:18px;}
.qb-login-foot{text-align:center;color:var(--muted);font-size:13.5px;margin:16px 0 0;}
.qb-login-foot b{color:var(--text);}

/* ── 2 · HOME ────────────────────────────────────────── */
.qb-home{padding:18px 18px 22px;gap:0;}
.qb-topbar{display:flex;align-items:center;justify-content:space-between;}
.qb-icon-btn{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;}
.qb-icon-btn span{width:18px;height:2.4px;border-radius:2px;background:var(--primary);}
.qb-icon-btn span:nth-child(2){width:13px;}
.qb-home-hello{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 2px 4px;}
.qb-hello-k{font-size:14px;color:var(--muted);font-weight:600;}
.qb-hello-name{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:38px;line-height:.9;margin:2px 0 0;}
.qb-pts-chip{text-align:right;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;}
.qb-pts-num{display:block;font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--lime);line-height:1;}
.qb-pts-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.qb-section-head{display:flex;align-items:center;gap:9px;margin:24px 2px 12px;}
.qb-section-head h3{font-size:15px;font-weight:800;margin:0;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.qb-count{background:var(--surface-3);color:var(--muted);font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;}
.qb-q-list{display:flex;flex-direction:column;gap:12px;}
.qb-q-card{display:flex;align-items:stretch;gap:0;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;cursor:pointer;padding:0;color:inherit;transition:.15s;position:relative;}
.qb-q-card:active{transform:scale(.99);}
.qb-q-bar{position:relative;width:10px;flex-shrink:0;background:var(--c);overflow:hidden;}
.qb-q-block{position:absolute;left:0;right:0;}
.qb-q-block.b1{top:0;height:40%;background:var(--c);}
.qb-q-block.b2{top:40%;height:30%;background:var(--a);}
.qb-q-block.b3{top:70%;bottom:0;background:var(--primary);}
.qb-q-body{flex:1;padding:14px 6px 14px 14px;min-width:0;}
.qb-q-row1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.qb-q-name{font-size:17px;font-weight:800;margin:0;letter-spacing:.2px;}
.qb-q-pending{flex-shrink:0;background:rgba(255,59,98,.16);color:var(--primary);font-size:11px;font-weight:800;border-radius:20px;padding:3px 9px;}
.qb-q-meta{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;color:var(--muted);font-weight:600;}
.qb-q-rank{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--c);}
.qb-q-rank small{font-size:11px;color:var(--muted);font-weight:700;}
.qb-q-mypts{color:var(--lime);font-weight:800;}
.qb-dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}
.qb-q-next{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;color:var(--muted);background:var(--surface-2);
  border-radius:9px;padding:7px 9px;font-weight:600;}
.qb-q-next-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.qb-q-next b{color:var(--text);margin-left:auto;font-weight:700;white-space:nowrap;flex-shrink:0;}
.qb-live-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(255,59,98,.2);animation:pulse 1.6s infinite;}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,59,98,0);}}
.qb-q-arrow{align-self:center;color:var(--muted-2);margin-right:8px;flex-shrink:0;}
.qb-home-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px;}

/* ── 3 · QUINIELA ────────────────────────────────────── */
.qb-quiniela{padding:0;}
.qb-qhead{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--bg)),var(--bg));
  border-bottom:1px solid var(--line);}
.qb-back{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qb-qhead-mid{flex:1;min-width:0;}
.qb-qhead-name{font-size:18px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qb-qhead-code{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;}
.qb-qhead-me{text-align:right;flex-shrink:0;}
.qb-qhead-rank{display:block;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--lime);line-height:1;}
.qb-qhead-pts{font-size:11px;color:var(--muted);font-weight:700;}
.qb-tabs{display:flex;gap:8px;padding:12px 16px 4px;background:var(--bg);position:sticky;top:71px;z-index:4;}
.qb-tabs button{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-family:var(--font-ui);
  font-weight:800;font-size:14px;border-radius:11px;padding:11px;cursor:pointer;transition:.15s;}
.qb-tabs button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent;}
.qb-q-content{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;}
.qb-jchips{display:flex;gap:8px;}
.qb-jchip{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-family:var(--font-display);
  font-weight:800;font-size:15px;border-radius:10px;padding:7px 16px;cursor:pointer;}
.qb-jchip.on{background:var(--surface-3);color:var(--text);border-color:var(--line-2);}

/* jornada banner */
.qb-jbanner{position:relative;border-radius:16px;overflow:hidden;padding:16px 18px;
  background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));min-height:92px;display:flex;align-items:center;}
.qb-jb-block{position:absolute;}
.qb-jb-block.jb1{top:0;right:0;width:54px;height:46px;background:var(--a);}
.qb-jb-block.jb2{bottom:0;right:0;width:54px;height:46px;background:var(--primary);}
.qb-jb-block.jb3{top:50%;right:14px;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#fff;opacity:.92;}
.qb-jb-text{position:relative;z-index:1;}
.qb-jb-title{font-family:var(--font-display),'Arial Narrow',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:32px;line-height:.88;margin:0;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;}
.qb-jb-date{display:block;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.qb-jb-count{display:inline-flex;align-items:center;gap:5px;margin-top:9px;background:rgba(0,0,0,.32);color:#fff;
  font-size:11px;font-weight:800;border-radius:20px;padding:4px 11px;text-transform:uppercase;letter-spacing:.5px;}
.qb-jb-count.live{background:var(--lime);color:#0a2a00;}
.qb-jb-livedot{width:6px;height:6px;border-radius:50%;background:#0a2a00;animation:pulse2 1.4s infinite;}
@keyframes pulse2{50%{opacity:.3;}}

/* match card */
.qb-match-list{display:flex;flex-direction:column;gap:12px;}
.qb-match{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
.qb-match.is-star{border-color:color-mix(in srgb,var(--lime) 45%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--lime) 20%,transparent) inset;}
.qb-match.is-done{opacity:.92;}
.qb-star-ribbon{display:flex;align-items:center;gap:6px;color:#0a2a00;background:var(--lime);font-size:11.5px;font-weight:800;
  border-radius:8px;padding:5px 10px;margin:-2px 0 12px;text-transform:uppercase;letter-spacing:.3px;}
.qb-star-ribbon b{margin-left:2px;}
.qb-match-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.qb-match-grp{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
.qb-match-time{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;}
.qb-match-final{font-size:11px;font-weight:800;color:var(--muted);background:var(--surface-3);border-radius:7px;padding:3px 8px;}
.qb-match-teams{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.qb-team{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.qb-team-r{justify-content:flex-end;}
.qb-team-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qb-flag{display:inline-block;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;
  box-shadow:0 0 0 1.5px var(--line-2);}
.qb-vs{font-family:var(--font-ui);font-weight:800;font-size:10px;color:var(--muted-2);flex-shrink:0;text-transform:uppercase;letter-spacing:1px;}

/* pick buttons */
.qb-pick{display:flex;gap:8px;}
.qb-pick-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface-2);
  border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;cursor:pointer;color:var(--text);transition:.15s;}
.qb-pick-btn:active{transform:scale(.97);}
.qb-pick-k{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;}
.qb-pick-l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.qb-pick-btn.is-sel{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 18px -8px var(--primary);}
.qb-pick-btn.is-sel .qb-pick-l{color:rgba(255,255,255,.85);}
.qb-pick-btn.is-correct{background:color-mix(in srgb,var(--good) 18%,var(--surface-2));border-color:var(--good);color:var(--good);}
.qb-pick-btn.is-correct .qb-pick-l{color:var(--good);}
.qb-pick-btn.is-wrong{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface-2));}
.qb-pick-btn.is-wrong .qb-pick-l{color:var(--bad);}
.qb-pick-btn.is-dim{opacity:.4;}

/* exact score */
.qb-exact{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-2);}
.qb-exact-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.qb-exact-head span{font-size:12.5px;font-weight:800;}
.qb-exact-head em{color:var(--muted);font-weight:600;font-style:normal;}
.qb-exact-pts{color:var(--lime)!important;}
.qb-exact-row{display:flex;align-items:center;justify-content:center;gap:18px;}
.qb-exact-team{display:flex;align-items:center;gap:10px;}
.qb-exact-dash{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--muted-2);}

/* stepper */
.qb-stepper{display:flex;flex-direction:column;align-items:center;gap:4px;}
.qb-step-btn{width:36px;height:24px;border-radius:8px;background:transparent;border:1.5px solid color-mix(in srgb,var(--lime) 55%,transparent);
  color:var(--lime);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.qb-step-btn:active{background:color-mix(in srgb,var(--lime) 16%,transparent);}
.qb-step-num{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1;width:30px;text-align:center;}
.qb-stepper.is-disabled{opacity:.5;}

/* result bar */
.qb-result-bar{margin-top:12px;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;text-align:center;}
.qb-result-bar b{font-family:var(--font-display);font-size:16px;}
.qb-result-bar.win{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);}
.qb-result-bar.lose{background:var(--surface-2);color:var(--muted);}

/* empty (locked jornada) */
.qb-empty{text-align:center;color:var(--muted);padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.qb-empty svg{color:var(--muted-2);}
.qb-empty p{font-size:16px;font-weight:800;color:var(--text);margin:6px 0 0;}
.qb-empty span{font-size:13px;max-width:240px;line-height:1.4;}

/* ranking */
.qb-ranking{display:flex;flex-direction:column;gap:8px;}
.qb-rank-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px;}
.qb-rank-row.is-you{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface));}
.qb-rank-pos{font-family:var(--font-display);font-weight:800;font-size:18px;width:24px;text-align:center;color:var(--muted);flex-shrink:0;}
.qb-rank-pos.p1{color:#f5c542;}.qb-rank-pos.p2{color:#cfd3da;}.qb-rank-pos.p3{color:#d99058;}
.qb-rank-id{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}
.qb-rank-av{width:38px;height:38px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:var(--text);flex-shrink:0;}
.is-you .qb-rank-av{background:var(--primary);color:#fff;}
.qb-rank-name{display:block;font-size:15px;font-weight:700;}
.qb-rank-sub{font-size:11.5px;color:var(--muted);font-weight:600;}
.qb-rank-pts{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--lime);flex-shrink:0;}
.qb-rank-pts small{font-size:11px;color:var(--muted);font-weight:700;margin-left:2px;}

/* ── modals ──────────────────────────────────────────── */
.qb-modal-scrim{position:absolute;inset:0;background:rgba(5,4,12,.72);backdrop-filter:blur(3px);display:flex;
  align-items:flex-end;justify-content:center;z-index:50;border-radius:18px;overflow:hidden;}
.qb-modal{width:100%;background:var(--surface);border-top:1px solid var(--line-2);border-radius:24px 24px 0 0;
  padding:22px 20px 26px;animation:sheet .25s cubic-bezier(.2,.8,.2,1);}
@keyframes sheet{from{transform:translateY(100%);}}
.qb-modal-title{font-family:var(--font-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:26px;margin:0 0 18px;}
.qb-modal .qb-label{margin-top:14px;}
.qb-modal .qb-btn-primary{margin-top:20px;}
.qb-input-code{text-align:center;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:3px;}
.qb-codecard{margin-top:16px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:14px;padding:14px;text-align:center;}
.qb-codeval{display:block;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--lime);letter-spacing:2px;margin:4px 0;}
.qb-code-hint,.qb-join-hint{font-size:12px;color:var(--muted);font-weight:600;}
.qb-join-hint{margin:12px 0 0;text-align:center;}

/* scrollbar */
.qb-app ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/android-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="qb-data.jsx"></script>
<script type="text/babel" src="qb-components.jsx"></script>
<script type="text/babel" src="qb-screens.jsx"></script>
<script type="text/babel" src="qb-quiniela.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#1F8A5B",
  "accentColor": "#facc15",
  "headline": "Saira Condensed",
  "radius": 20
}/*EDITMODE-END*/;

const PERSIST_KEY = 'quiniball.picks.v1';

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState('login');
  const [activeQ, setActiveQ] = useState(null);
  const [modal, setModal] = useState(null);
  const [scale, setScale] = useState(1);
  const [picks, setPicks] = useState(() => {
    try { return JSON.parse(localStorage.getItem(PERSIST_KEY)) || {}; } catch(e){ return {}; }
  });

  useEffect(() => { localStorage.setItem(PERSIST_KEY, JSON.stringify(picks)); }, [picks]);

  useEffect(() => {
    const fit = () => setScale(Math.min((window.innerHeight - 44) / 892, (window.innerWidth - 44) / 412, 1));
    fit(); window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  const onPick = (id, k) => setPicks(p => ({ ...p, [id]: { ...(p[id]||{}), pick: k } }));
  const onExact = (id, sc) => setPicks(p => ({ ...p, [id]: { ...(p[id]||{}), exact: sc } }));

  const vars = {
    '--primary': t.primaryColor,
    '--lime': t.accentColor,
    '--font-display': t.headline,
    '--radius': t.radius + 'px',
  };

  return (
    <div className="qb-stage">
      <div className="qb-fit" style={{ transform:`scale(${scale})` }}>
        <div className="qb-app" style={vars}>
          <AndroidDevice dark>
            {route === 'login' && <LoginScreen onLogin={() => setRoute('home')} />}
            {route === 'home' && (
              <HomeScreen
                onOpen={(q) => { setActiveQ(q); setRoute('quiniela'); }}
                onCreate={() => setModal('create')}
                onJoin={() => setModal('join')} />
            )}
            {route === 'quiniela' && activeQ && (
              <QuinielaScreen quiniela={activeQ} onBack={() => setRoute('home')}
                picks={picks} onPick={onPick} onExact={onExact} />
            )}
          </AndroidDevice>
          {modal === 'create' && <CreateModal onClose={() => setModal(null)} />}
          {modal === 'join' && <JoinModal onClose={() => setModal(null)} />}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Color" />
        <TweakColor label="Primario" value={t.primaryColor}
          options={['#ff3b62','#2A6FDB','#1F8A5B','#7A5AE0','#f97316']}
          onChange={(v)=>setTweak('primaryColor', v)} />
        <TweakColor label="Acento" value={t.accentColor}
          options={['#b6f24a','#34d399','#facc15','#22d3ee']}
          onChange={(v)=>setTweak('accentColor', v)} />
        <TweakSection label="Estilo" />
        <TweakRadio label="Titulares" value={t.headline}
          options={['Saira Condensed','Archivo','Oswald']}
          onChange={(v)=>setTweak('headline', v)} />
        <TweakSlider label="Redondeo" value={t.radius} min={8} max={28} unit="px"
          onChange={(v)=>setTweak('radius', v)} />
        <TweakButton label="Reiniciar pronósticos"
          onClick={()=>{ setPicks({}); }} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
