<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QuiniBall</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0a1f44; /* azul Mundial 2026 */
        color: #f8fafc;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
      }
      .ball {
        width: 72px;
        height: 72px;
        border-radius: 9999px;
        border: 4px solid rgba(248, 250, 252, 0.25);
        border-top-color: #f8fafc;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 1.4rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0; opacity: 0.7; font-size: 0.95rem; max-width: 22rem; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ball" aria-hidden="true"></div>
      <h1>QuiniBall</h1>
      <p>Conectando… Si no carga, revisa tu conexión a internet.</p>
    </div>
  </body>
</html>
